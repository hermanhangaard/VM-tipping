name: test
on: workflow_dispatch

jobs:
  hei:
    runs-on: ubuntu-latest
    steps:
      - name: Hent ligaen fra FPL-API-et
        run: |
          curl -s "https://fantasy.premierleague.com/api/leagues-classic/562901/standings/" \
          | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('Liga:', d['league']['name'])
          print('Deltakere:', len(d['standings']['results']))
          for r in d['standings']['results']:
              print(' ', r['rank'], r['entry_name'], '-', r['total'], 'p')
          "
