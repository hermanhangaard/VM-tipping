name: FPL board

on:
  schedule:
    # NB: UTC. 5 min er GitHubs korteste tillatte intervall, og de dropper
    # planlagte kjoeringer under last uansett: maalt 22.08 ga '*/10' reelle
    # intervaller paa 16-34 min. Vi ber om dobbelt saa ofte for aa faa flere
    # faktiske kjoeringer - build.py avslutter paa under et sekund naar det
    # ikke er kamper, saa bomturene er gratis.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # committe data/ tilbake
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Bygg tavla
        id: bygg
        run: python build.py

      - name: Lagre historikk
        if: steps.bygg.outputs.bygget == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "ingen endring i data/"
          else
            git commit -m "Oppdater historikk $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Last opp Pages-artifact
        if: steps.bygg.outputs.bygget == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deploy
        if: steps.bygg.outputs.bygget == 'true'
        uses: actions/deploy-pages@v5
